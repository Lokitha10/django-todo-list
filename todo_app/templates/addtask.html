<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Task</title>
</head>
<body>
    <h1 style="color:Blue; text-align: center;">Add New Task</h1>
    <form method="POST" action="{% url 'addtask' %}">
        {% csrf_token %}
        Task Title:<input type="text" name="tasktitle"><br><br>
        Description:<input type="text" name="taskdesc"><br><br>
        status:<ol>
            <li>
                <input type="radio" name="status" value="Pending">Pending
                <input type="radio" name="status" value="Completed">Completed
            </li>
        </ol>
        <button type="Submit" text-align="left">Save Task</button>
        <button type="submit" text-align="left">Cancel</button>
    </form>

</body>
</html>
