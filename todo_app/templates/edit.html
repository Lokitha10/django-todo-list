<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Edit Task</h1>
    <form method="POST" action="{% url 'update_todo' todo.id %}" id="edit1">
        {% csrf_token %}
        Task Title:<input type="text" name="tasktitle" value="{{todo.tasktitle}}"><br><br>
        Description:<input type="text" name="taskdesc" value="{{todo.taskdesc}}"><br><br>
        status:<ol>
            <li>
                <input type="radio" name="status" value="Pending">Pending
                <input type="radio" name="status" value="Completed">Completed
            </li>
        </ol>
        <button type="submit" text-align="left">Update Task</button>
        <a href="{% url 'home' %}">
            <button type="button" text-align="left">Cancel</button>
        </a>
    </form>
</body>
</html>
